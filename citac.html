<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>@Booker 3D Čitač Sveske</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0f172a;
      user-select: none;
      -webkit-user-select: none;
    }
    .page-canvas-wrap {
      background-color: #ffffff;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    @media print {
      body.no-print { display: none !important; }
    }
  </style>
</head>
<body class="no-print h-screen w-screen flex flex-col justify-between bg-slate-950 text-white" oncontextmenu="return false;">

  <!-- Gornja traka sa kontrolama i licencom -->
  <header class="bg-slate-900/95 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between z-30 shrink-0">
    <div class="flex items-center gap-3 truncate">
      <span class="px-2.5 py-1 bg-indigo-600 rounded-lg text-xs font-black uppercase tracking-wider">📖 3D Sveska</span>
      <div class="truncate">
        <h1 id="book-title" class="text-sm sm:text-base font-black truncate">Mentalna Gimnastika - Radna sveska</h1>
        <p id="book-license" class="text-[11px] text-slate-400 font-mono">Zaštićeno izdanje</p>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <span id="page-counter" class="text-xs font-black bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl text-indigo-300">
        Strana 1 / 1
      </span>
      <button id="btn-print" onclick="window.stampaSveske()" class="hidden px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-black transition items-center gap-1.5 shadow-sm">
        <span>🖨️</span> Štampaj
      </button>
      <a id="btn-download" href="#" download class="hidden px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-black transition items-center gap-1.5 shadow-sm">
        <span>📥</span> Preuzmi PDF
      </a>
    </div>
  </header>

  <!-- Srednji prostor za 3D listanje knjige -->
  <main class="flex-1 relative flex items-center justify-center p-2 sm:p-6 overflow-hidden">
    <div id="loader-box" class="flex flex-col items-center justify-center space-y-3 text-center z-20">
      <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
      <p id="loader-text" class="text-sm font-bold text-slate-300">Priprema 3D stranica za listanje...</p>
    </div>

    <!-- Knjiga -->
    <div id="flipbook-container" class="hidden relative shadow-2xl"></div>

    <!-- Vodeni žig licence -->
    <div id="watermark-overlay" class="pointer-events-none fixed bottom-16 right-6 z-40 opacity-25 text-[11px] font-mono font-black text-white bg-black/40 px-2.5 py-1 rounded"></div>
  </main>

  <!-- Donja navigacija za listanje -->
  <footer class="bg-slate-900/95 border-t border-slate-800 px-4 py-2.5 flex items-center justify-center gap-4 z-30 shrink-0">
    <button onclick="window.prethodnaStrana()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 rounded-xl text-xs sm:text-sm font-black border border-slate-700 transition">
      ‹ Prethodna
    </button>
    <span class="text-[11px] text-slate-400 font-bold hidden sm:inline">Prevucite ugao stranice mišem ili prstom za 3D listanje</span>
    <button onclick="window.sledecaStrana()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 rounded-xl text-xs sm:text-sm font-black shadow-md transition">
      Sledeća ›
    </button>
  </footer>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const params = new URLSearchParams(window.location.search);
    const pdfUrl = params.get('pdf') || '';
    const naslov = params.get('title') || 'Radna sveska';
    const licenca = params.get('lic') || 'Aktivna licenca';
    const dozvoliStampu = params.get('print') === '1';

    document.getElementById('book-title').innerText = naslov;
    document.getElementById('book-license').innerText = licenca;
    document.getElementById('watermark-overlay').innerText = `${licenca} • Mentalna Gimnastika`;

    if (dozvoliStampu) {
      document.body.classList.remove('no-print');
      const btnP = document.getElementById('btn-print');
      const btnD = document.getElementById('btn-download');
      if (btnP) { btnP.classList.remove('hidden'); btnP.classList.add('flex'); }
      if (btnD) { btnD.href = pdfUrl; btnD.classList.remove('hidden'); btnD.classList.add('flex'); }
    }

    // Zabrana prečica za štampu i čuvanje ako nije dozvoljeno
    window.addEventListener('keydown', (e) => {
      if (!dozvoliStampu && (e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's')) {
        e.preventDefault();
      }
    });

    let pageFlip = null;

    // Blagi šušanj papira pri okretanju lista
    function zvukOkretanjaStrane() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = ctx.sampleRate * 0.09;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.03));
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1200;
        const gain = ctx.createGain();
        gain.gain.value = 0.08;
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
      } catch(e) {}
    }

    async function ucitajPdfUKnjigu() {
      if (!pdfUrl) {
        document.getElementById('loader-text').innerText = "Nije prosleđen link do PDF sveske.";
        return;
      }

      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdf = await loadingTask.promise;
        const ukupnoStrana = pdf.numPages;
        const container = document.getElementById('flipbook-container');

        const prvaStrana = await pdf.getPage(1);
        const vp1 = prvaStrana.getViewport({ scale: 1 });
        const odnosStranice = vp1.width / vp1.height;

        const maxVisina = window.innerHeight - 135;
        const maxSirina = window.innerWidth - 30;
        const jeMobilni = window.innerWidth < 768;

        let visinaStrane = Math.min(maxVisina, 760);
        let sirinaStrane = Math.round(visinaStrane * odnosStranice);

        if (jeMobilni && sirinaStrane > maxSirina) {
          sirinaStrane = maxSirina;
          visinaStrane = Math.round(sirinaStrane / odnosStranice);
        } else if (!jeMobilni && sirinaStrane * 2 > maxSirina) {
          sirinaStrane = Math.floor(maxSirina / 2);
          visinaStrane = Math.round(sirinaStrane / odnosStranice);
        }

        for (let broj = 1; broj <= ukupnoStrana; broj++) {
          document.getElementById('loader-text').innerText = `Učitavanje stranice ${broj} od ${ukupnoStrana}...`;
          const page = await pdf.getPage(broj);
          const scale = (sirinaStrane * 2) / page.getViewport({ scale: 1 }).width;
          const viewport = page.getViewport({ scale });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page-canvas-wrap';

          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.style.width = '100%';
          canvas.style.height = '100%';

          await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
          pageDiv.appendChild(canvas);
          container.appendChild(pageDiv);
        }

        document.getElementById('loader-box').classList.add('hidden');
        container.classList.remove('hidden');

        pageFlip = new St.PageFlip(container, {
          width: sirinaStrane,
          height: visinaStrane,
          size: 'fixed',
          showCover: true,
          maxShadowOpacity: 0.4,
          mobileScrollSupport: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page-canvas-wrap'));
        document.getElementById('page-counter').innerText = `Strana 1 / ${ukupnoStrana}`;

        pageFlip.on('flip', (e) => {
          zvukOkretanjaStrane();
          document.getElementById('page-counter').innerText = `Strana ${e.data + 1} / ${ukupnoStrana}`;
        });

      } catch (err) {
        // Ako je PDF na drugom serveru koji brani direktno čitanje, otvaramo ga kroz ugrađeni čitač
        const container = document.getElementById('flipbook-container');
        document.getElementById('loader-box').classList.add('hidden');
        container.classList.remove('hidden');
        container.className = "w-full h-full";
        container.innerHTML = `<iframe src="https://docs.google.com/viewer?url=${encodeURIComponent(pdfUrl)}&embedded=true" class="w-full h-full border-0 bg-white rounded-xl"></iframe>`;
      }
    }

    window.prethodnaStrana = () => { if (pageFlip) pageFlip.flipPrev(); };
    window.sledecaStrana = () => { if (pageFlip) pageFlip.flipNext(); };
    window.stampaSveske = () => { if (dozvoliStampu && pdfUrl) window.open(pdfUrl, '_blank'); };

    ucitajPdfUKnjigu();
  </script>
</body>
</html>
